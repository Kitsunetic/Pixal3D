dataset:
  source: ObjaverseXL_sketchfab

batch:
  shard: ObjaverseXL_sketchfab-00000
  name: batch000

paths:
  control_root: /home/rvi/ns2/youngwoo/pixal3d/control
  existing_prepared_root: /home/rvi/ns2/youngwoo/pixal3d/prepared
  # 01~05 intermediate는 NS3, 06 tar staging은 로컬, 검증된 결과는 NS2 prepared에 합친다.
  work_root: /home/rvi/ns3/youngwoo/pixal3d/preprocess_v2
  local_temp_root: ./data/preprocess_finalize
  prepared_root: /home/rvi/ns2/youngwoo/pixal3d/prepared

raw:
  mode: direct_glb
  root: /home/rvi/ns3/jaehyeok/ds/Objaverse-full
  # archive에서 새로 푼 Sketchfab GLB와 archive 밖의 기존 direct GLB를 함께 읽는다.
  glb_roots:
    - glbs_direct
    - glbs

stages:
  dump: {}
  render:
    resolution: 512
    seed: null
  voxelize:
    resolutions: "256,512,1024"
    view_indices: "0-1"
    native_threads: 4
  encode:
    # flex_gemm 1024 shape 인코딩 실패 후보(최대 view 84,974,147 voxel); 05/06에서 제외.
    exclude_asset_ids:
      - b4860fb771bfab25ef17224e38b729298a20adaa9207e573ced065fa50644129
    resolutions: "256,512,1024"
    ss_resolution: 64
    view_indices: "0-1"
    loader_workers: 8
    saver_workers: 2
    micro_batch_sizes: "64:16,256:4,512:2,1024:1"
    latent_dtype: float16
    gpu_memory_target_percent: 90.0
    timeout_seconds: 900
