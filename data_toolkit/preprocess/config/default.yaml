dataset:
  source: ObjaverseXL_sketchfab

batch:
  shard: ObjaverseXL_sketchfab-00000
  name: batch000

paths:
  control_root: /home/rvi/ns2/youngwoo/pixal3d/control
  existing_prepared_root: /home/rvi/ns2/youngwoo/pixal3d/prepared
  # NS2 legacy prepared는 read-only로 유지한다. v2 intermediate와 publish 결과는 NS3에 분리한다.
  work_root: /home/rvi/ns3/youngwoo/pixal3d/preprocess_v2
  prepared_root: /home/rvi/ns3/youngwoo/pixal3d/prepared-v2

raw:
  mode: direct_glb
  root: /home/rvi/ns3/jaehyeok/ds/Objaverse-full
  # archive에서 새로 푼 Sketchfab GLB와 archive 밖의 기존 direct GLB를 함께 읽는다.
  glb_roots:
    - glbs_direct
    - glbs

stages:
  dump: {}
  render:
    resolution: 512
    seed: null
  voxelize:
    resolutions: "256,512,1024"
    view_indices: "0-1"
    native_threads: 4
  encode:
    resolutions: "256,512,1024"
    ss_resolution: 64
    view_indices: "0-1"
    loader_workers: 2
    saver_workers: 2
    micro_batch_sizes: "64:16,256:16,512:8,1024:4"
    latent_dtype: float16
    gpu_memory_target_percent: 90.0
    timeout_seconds: 900
